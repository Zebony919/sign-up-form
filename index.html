<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up-form</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>

    <body>
        <section class="image-content">
            <div class="logo">
                <img src="./images/odin-lined.png">
                <h1>Odin</h1>
            </div>
        </section>

        <section class="sign-up-content">
            <h1 class="title">Sign-Up for the Peaceful Life</h1>

            <div>
                <form id="sign-up-form">
                    <div class="input-box">
                        <div class="form-field">
                            <label for="firstName">First Name:</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>

                        <div class="form-field">
                            <label for="lastName">Last Name:</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>  
                        
                        <div class="form-field">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-field">
                            <label for="phoneNumber">Phone Number:</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" required>
                        </div> 

                        <div class="form-field">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" required minlength="8">
                        </div>

                        <div class="form-field">
                            <label for="confirmPassword">Confirm Password:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div> 
                    </div>

                    <button type="submit" class="create-account">Create Account</button>
                </form>

                <p class="log-in">Already have an account? <a href="#">Log in</a></p>
            </div>
        </section>
    </body>
</html>
